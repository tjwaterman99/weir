[package]
name = "weir"
version = "0.2.1"
edition = "2021"
rust-version = "1.89"
description = "Keeps a set of repositories from a provider mirrored locally, read-only"
license = "MIT"
publish = false
build = "build.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
ctrlc = { version = "3", features = ["termination"] }
glob = "0.3"
rpassword = "7"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
terminal_size = "0.4"
ureq = { version = "2", features = ["json"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
